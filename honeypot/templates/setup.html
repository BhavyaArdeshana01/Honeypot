<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHANTOM GRID — INITIALIZATION</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--c-bg:#020912;--c-panel:#040e1f;--c-border:#0d2d55;--c-accent:#00e5ff;--c-accent2:#ff3d71;--c-text:#8cb8d4;--c-bright:#e0f4ff;--c-green:#00ff88;--c-warn:#ffcc00;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--c-bg);color:var(--c-text);font-family:'Share Tech Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
  .scanline{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;animation:scan 8s linear infinite;}
  @keyframes scan{0%{background-position:0 0;}100%{background-position:0 100vh;}}
  .container{position:relative;z-index:10;width:460px;}
  .logo{text-align:center;margin-bottom:40px;}
  .logo-hex{font-size:11px;color:var(--c-accent);letter-spacing:.15em;animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.6;}50%{opacity:1;}}
  .logo h1{font-family:'Rajdhani',sans-serif;font-size:42px;font-weight:700;color:var(--c-bright);letter-spacing:.08em;line-height:1;margin:8px 0 4px;}
  .logo h1 span{color:var(--c-accent);}
  .logo-sub{font-size:11px;letter-spacing:.3em;color:var(--c-text);text-transform:uppercase;}
  .panel{background:var(--c-panel);border:1px solid var(--c-border);padding:32px;position:relative;}
  .panel::before{content:'';position:absolute;top:-1px;left:20px;right:20px;height:2px;background:linear-gradient(90deg,transparent,var(--c-accent),transparent);}
  .panel-title{font-size:11px;letter-spacing:.25em;color:var(--c-accent);margin-bottom:24px;display:flex;align-items:center;gap:8px;}
  .panel-title::after{content:'';flex:1;height:1px;background:var(--c-border);}
  .field{margin-bottom:20px;}
  label{display:block;font-size:10px;letter-spacing:.2em;color:var(--c-text);margin-bottom:8px;text-transform:uppercase;}
  input{width:100%;background:rgba(0,229,255,.03);border:1px solid var(--c-border);color:var(--c-bright);font-family:'Share Tech Mono',monospace;font-size:14px;padding:12px 14px;outline:none;transition:border-color .2s;}
  input:focus{border-color:var(--c-accent);box-shadow:0 0 0 1px rgba(0,229,255,.15);}
  .btn{width:100%;background:transparent;border:1px solid var(--c-accent);color:var(--c-accent);font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.2em;padding:14px;cursor:pointer;transition:all .2s;text-transform:uppercase;margin-top:8px;}
  .btn:hover{background:rgba(0,229,255,.08);box-shadow:0 0 20px rgba(0,229,255,.2);}
  .error{color:var(--c-accent2);font-size:11px;letter-spacing:.1em;margin-bottom:16px;padding:10px;border:1px solid rgba(255,61,113,.2);background:rgba(255,61,113,.05);}
  .warn{color:var(--c-warn);font-size:10px;letter-spacing:.08em;margin-top:20px;padding:10px;border-left:2px solid var(--c-warn);}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="container">
  <div class="logo">
    <div class="logo-hex">◈ SECURITY SYSTEM INITIALIZATION ◈</div>
    <h1>PHANTOM<span>GRID</span></h1>
    <div class="logo-sub">Honeypot Intelligence Platform v2.0</div>
  </div>
  <div class="panel">
    <div class="panel-title">◉ CREATE ADMIN CREDENTIALS</div>
    {% if error %}<div class="error">⚠ {{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label>Admin Username</label>
        <input name="username" type="text" placeholder="admin" autocomplete="off" required>
      </div>
      <div class="field">
        <label>Admin Password (min 6 chars)</label>
        <input name="password" type="password" placeholder="••••••••" required>
      </div>
      <button class="btn" type="submit">▶ INITIALIZE SYSTEM</button>
    </form>
    <div class="warn">⚡ These credentials protect the honeypot control panel. Store them securely.</div>
  </div>
</div>
</body>
</html>
